<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#23343B">
<title>CRESCE</title>
<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
<a class="brand" href="#inicio" aria-label="CRESCE · Holding"><span class="cresce-mini-logo" aria-hidden="true"></span><strong>CRESCE</strong><span id="current-space" hidden></span></a>
<nav class="area-shortcuts" aria-label="Áreas de trabajo"><a class="area-shortcut" href="#trovofarma/resumen"><span class="shortcut-visual"><img src="assets/logos/trovofarma.png" alt="Logo original de Trovofarma Store" width="328" height="361"></span><span>Trovofarma Store</span></a><a class="area-shortcut" href="#casa-del-filo/resumen"><span class="shortcut-visual"><img src="assets/logos/La Casa del Filo.png" alt="Logo original de La Casa del Filo" width="375" height="374"></span><span>La Casa del Filo</span></a><a class="area-shortcut" href="#proyectos/resumen"><span class="shortcut-visual"><img src="assets/logos/Gestion de proyectos.png" alt="Logo original de Gestión de Proyectos" width="1024" height="1024"></span><span>Gestión de Proyectos</span></a><a class="area-shortcut" href="#strongroot/resumen"><span class="shortcut-visual"><img src="assets/logos/Logo Strongroot.png" alt="Logo original de StrongRoot" width="1024" height="1024"></span><span>StrongRoot</span></a></nav>
<div class="header-actions">
<div class="search-wrap"><span class="search-symbol" aria-hidden="true">⌕</span><input id="global-search" class="global-search" type="search" placeholder="Buscar secciones…" aria-label="Buscar áreas y secciones" aria-controls="search-results" autocomplete="off"><nav id="search-results" class="top-menu search-results" aria-label="Resultados de búsqueda" hidden></nav></div>
<nav class="topbar-tools" aria-label="Herramientas">
<details class="workspace-picker icon-control" hidden><summary aria-label="Notificaciones" title="Notificaciones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5l-2 3Z M10 20h4"/></svg></summary><div class="top-menu"><p><strong>Notificaciones</strong></p><p>Sin notificaciones por ahora. Este panel aún no está conectado a eventos.</p></div></details>
<details class="workspace-picker icon-control profile"><summary aria-label="Perfil y configuración" title="Perfil y configuración"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3 3-1 3 1 1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3-3 1-3-1Z"/><circle cx="12" cy="12" r="3"/></svg></summary><nav class="top-menu" aria-label="Perfil y configuración"><p><strong>Espacio local</strong>Perfil de demostración</p><a id="settings-link" href="#trovofarma/configuracion">Configuración del espacio</a><p>Las preferencias se organizan dentro de cada área.</p></nav></details>
</nav></div>
</header>
<main id="contenido" tabindex="-1"></main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const search = document.getElementById('global-search');
  const results = document.getElementById('search-results');
  const spaces = document.querySelectorAll('.topbar details');
  const destinations = [{name:'Inicio',href:'#inicio'},...areas.flatMap(a=>a.modules.map(m=>({name:a.name+' · '+m,href:'#'+a.id+'/'+slug(m)})))];
  const normalize = value => value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  function updateSpace(){
    const area = areas.find(a=>a.id===location.hash.slice(1).split('/')[0]);
    const currentSpace=document.getElementById('current-space');
    currentSpace.textContent=area?area.name:'';
    currentSpace.hidden=!area;
    document.getElementById('settings-link').href='#'+(area?area.id:'trovofarma')+'/configuracion';
    document.querySelectorAll('.area-shortcut').forEach(link=>{
      if(area && link.hash.split('/')[0]==='#'+area.id) link.setAttribute('aria-current','page');
      else link.removeAttribute('aria-current');
    });
    results.hidden=true;
    search.value='';
    spaces.forEach(d=>d.open=false);
  }
  search.addEventListener('input',()=>{
    results.replaceChildren();
    const query=normalize(search.value.trim());
    if(!query){results.hidden=true;return;}
    const matches=destinations.filter(d=>normalize(d.name).includes(query)).slice(0,10);
    for(const match of matches){const link=document.createElement('a');link.href=match.href;link.textContent=match.name;results.append(link);}
    if(!matches.length){const empty=document.createElement('p');empty.textContent='No hay secciones con ese nombre.';results.append(empty);}
    results.hidden=false;
  });
  search.addEventListener('keydown',event=>{if(event.key==='Escape'){results.hidden=true;}if(event.key==='Enter'){const first=results.querySelector('a');if(first&&!results.hidden){event.preventDefault();first.click();}}});
  spaces.forEach(detail=>detail.addEventListener('toggle',()=>{if(detail.open)spaces.forEach(other=>{if(other!==detail)other.open=false;});}));
  document.addEventListener('click',event=>{if(!event.target.closest('.search-wrap'))results.hidden=true;spaces.forEach(d=>{if(!d.contains(event.target))d.open=false;});});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'){spaces.forEach(d=>d.open=false);results.hidden=true;}});
  document.querySelector('.topbar').addEventListener('click',event=>{if(event.target.closest('a')){results.hidden=true;spaces.forEach(d=>d.open=false);}});
  window.addEventListener('hashchange',updateSpace);
  updateSpace();
});
</script>
</body>
</html>
